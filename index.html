<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MicroClima - Clima de Precisão</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#18191c">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="app-container">
    <header class="app-header">
      <h1 class="brand-title">MicroClima</h1>
      <div class="header-actions">
        <button class="icon-button" id="btn-location" aria-label="Pesquisar cidade" title="Pesquisar cidade">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="11" cy="11" r="7"></circle>
            <path d="m20 20-4-4"></path>
          </svg>
        </button>
        <button class="icon-button" id="btn-refresh" aria-label="Atualizar" title="Atualizar">↻</button>
      </div>
    </header>

    <section id="current-card" class="current-card">
      <div class="skeleton-loader">Obtendo dados de localização...</div>
    </section>

    <div id="alert-banner" class="alert-banner hidden"></div>

    <section class="section-container">
      <div id="hourly-forecast" class="hourly-scroll"></div>
    </section>

    <div id="weather-banner" class="weather-banner">
      <div class="banner-content">
        <span class="banner-tag">Radar Ativo</span>
        <p class="banner-text">Monitoramento contínuo de alta precisão por coordenadas GPS.</p>
      </div>
    </div>

    <div id="weather-insight" class="insight-card hidden">
      <svg class="insight-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 6 13.5 15.5 8.5 10.5 1 18"></polyline>
        <polyline points="17 6 23 6 23 12"></polyline>
      </svg>
      <span id="insight-text">Calculando tendências...</span>
    </div>

    <section class="section-container">
      <div class="section-heading">
        <span>Previsão</span>
        <select id="forecast-days" class="days-select" aria-label="Quantidade de dias da previsão">
          <option value="3">3 dias</option>
          <option value="5">5 dias</option>
          <option value="7" selected>7 dias</option>
        </select>
      </div>
      <div id="daily-forecast" class="daily-scroll"></div>
    </section>
  </div>

  <div id="location-picker" class="location-picker hidden" role="dialog" aria-modal="true" aria-labelledby="location-picker-title">
    <div class="location-panel">
      <div class="location-panel-header">
        <div>
          <h2 id="location-picker-title">Escolher cidade</h2>
          <p>Consulte o clima de onde quiser.</p>
        </div>
        <button class="close-button" id="close-location-picker" aria-label="Fechar">×</button>
      </div>
      <button class="gps-option" id="use-my-location"><span>⌖</span><span><strong>Usar minha localização</strong><small>Identificar a cidade pelo GPS do celular</small></span></button>
      <input id="city-search" class="city-search" type="search" placeholder="Pesquisar cidade..." autocomplete="off">
      <div class="city-tabs" role="tablist">
        <button class="city-tab active" data-city-filter="sp">São Paulo</button>
        <button class="city-tab" data-city-filter="capital">Capitais</button>
        <button class="city-tab" data-city-filter="search">Buscar</button>
      </div>
      <div id="city-results" class="city-results"></div>
    </div>
  </div>

  <script src="js/utils/formatters.js"></script>
  <script src="js/utils/cache.js"></script>
  <script src="js/utils/location.js"></script>
  <script src="js/data/cities.js"></script>
  <script src="js/api/weatherService.js"></script>
  <script src="js/components/currentCard.js"></script>
  <script src="js/components/hourlyForecast.js"></script>
  <script src="js/components/dailyForecast.js"></script>
  <script src="js/components/locationPicker.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./sw.js').catch(err => console.log('Erro ao registrar SW:', err));
    }
  </script>
</body>
</html>
